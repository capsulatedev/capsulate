name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:sdk   # the other workspaces typecheck against the built SDK types
      - run: npm run typecheck
      - run: npm run build
      - run: node apps/cli/dist/index.js --version
